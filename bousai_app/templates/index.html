{% extends "base.html" %}

{% block content %}
<div class="page-card">
  <div class="section-title">
    <span class="pin">📍</span>
    <span>避難所マップ</span>
  </div>

  <div class="map-wrap">
    <div id="shelterMap"></div>
  </div>
</div>

<div class="page-card">
  <div class="weather-header">
    <div class="weather-title">
      <span class="icon">☁️</span>
      <span>藤沢市 気象警報・注意報</span>
    </div>
    <button class="refresh-badge" type="button" aria-label="更新">
      <span>↻</span>
      <span>10分おき自動更新</span>
    </button>
  </div>

  <div id="weatherContent" class="status-box">
    <div class="status-item"><span class="status-ok">✓</span><span>現在、警報・注意報は発表されていません</span></div>
    <div class="status-meta">◌ データ取得待機中...</div>
  </div>
</div>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
document.addEventListener('DOMContentLoaded', function() {
    const map = L.map('shelterMap', { zoomControl: false }).setView([35.3390, 139.4903], 12);
    L.control.zoom({ position: 'topleft' }).addTo(map);

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '© OpenStreetMap contributors',
        referrerPolicy: 'strict-origin-when-cross-origin'
    }).addTo(map);

    function updateWeatherContent(data) {
        const weatherContent = document.getElementById('weatherContent');

        if (data.error) {
            weatherContent.innerHTML = `
                <div class="status-item"><span class="status-ok">⚠</span><span>気象情報の取得に失敗しました</span></div>
            `;
            return;
        }

        const warningsHtml = (data.warnings && data.warnings.length > 0)
            ? '<div class="status-item"><span class="status-ok">⚠</span><span>' + data.warnings.map(w => `${w.name}（${w.status}）`).join(', ') + '</span></div>'
            : '<div class="status-item"><span class="status-ok">✓</span><span>現在、警報・注意報は発表されていません</span></div>';

        weatherContent.innerHTML = `
            <div class="status-item"><span class="status-ok">●</span><span>${data.area_name || '藤沢市'}</span></div>
            ${warningsHtml}
            <div class="status-meta">◌ データ取得時刻: ${data.last_fetch_time || '更新中...'}</div>
            <div class="status-meta">◌ 気象庁最終発表: ${data.report_time || '不明'}</div>
        `;
    }

    function updateWeatherWarnings() {
        fetch('/api/weather_warnings')
            .then(response => response.json())
            .then(data => updateWeatherContent(data))
            .catch(() => {
                document.getElementById('weatherContent').innerHTML = `
                    <div class="status-item"><span class="status-ok">⚠</span><span>気象情報の取得に失敗しました</span></div>
                `;
            });
    }

    updateWeatherWarnings();
    setInterval(updateWeatherWarnings, 600000);
});
</script>
{% endblock %}
